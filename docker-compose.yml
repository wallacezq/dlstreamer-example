services:
  dlstreamer-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}
    container_name: dlstreamer-pipeline
    network_mode: host
    privileged: true
    environment:
      - MODEL=${MODEL:-yolov8}
      - RTSP_INPUT=${RTSP_INPUT:-rtsp://127.0.0.1:8554/stream}
      - OUTPUT_HOST=${OUTPUT_HOST:-127.0.0.1}
      - OUTPUT_PORT=${OUTPUT_PORT:-5000}
      - DEVICE=${DEVICE:-CPU}
      - PRECISION=${PRECISION:-FP16}
      - TRACKER_TYPE=${TRACKER_TYPE:-short-term-imageless}
      - HTTP_PROXY=${HTTP_PROXY}
      - HTTPS_PROXY=${HTTPS_PROXY}
      - NO_PROXY=${NO_PROXY:-127.0.0.1,localhost}
      - DISPLAY=${DISPLAY:-:0}
      - GST_DEBUG=${GST_DEBUG:-*:2}
    # For Intel GPU access (DEVICE=GPU) or NPU access (DEVICE=NPU)
    volumes:
      # Mount custom models (optional, override built-in models)
      # - ./models:/app/models
      # Share X11 for debug display (optional)
      # - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
    restart: unless-stopped

  # Optional: RTSP test source using mediamtx
  rtsp-server:
    image: bluenviron/mediamtx:latest
    container_name: rtsp-server
    network_mode: host
    environment:
      - MTX_PROTOCOLS=tcp
    profiles:
      - test
    restart: unless-stopped

  # Optional: Generate a test RTSP stream from a video file
  test-stream:
    image: linuxserver/ffmpeg:latest
    container_name: test-stream
    network_mode: host
    profiles:
      - test_stream
    depends_on:
      - rtsp-server
    command: >
      -re -stream_loop -1
      -f lavfi -i testsrc=size=1920x1080:rate=30
      -c:v libx264 -preset ultrafast -tune zerolatency
      -f rtsp rtsp://localhost:8554/stream
    restart: unless-stopped
